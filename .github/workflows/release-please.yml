name: Release Please

on:
  push:
    branches: [main, master] # add your default branch here if it's neither

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Keeps the App key away from workflows running on other branches.
    environment: release
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_created: ${{ steps.publish.outputs.release_created }}
      tag_name: ${{ steps.publish.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            release-please-config.json
            .release-please-manifest.json
          sparse-checkout-cone-mode: false

      - name: Check setup
        env:
          APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID or RELEASE_APP_PRIVATE_KEY is empty. Add both as secrets of the 'release' environment (see README)."
            exit 1
          fi
          sha=$(jq -r '.packages["."]["bootstrap-sha"] // ""' release-please-config.json)
          if [ -z "$sha" ] || [ "$sha" = REPLACE_WITH_TRUNK_SHA ]; then
            echo "::error file=release-please-config.json::Set bootstrap-sha to the full SHA of the current trunk head."
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error file=release-please-config.json::bootstrap-sha must be a full 40-character commit SHA."
            exit 1
          fi
          # The publish step relies on the default label, title, branch name, and on release-please not tagging.
          key=$(jq -r --arg keys 'label release-label pull-request-title-pattern component package-name skip-github-release changelog-path skip-changelog include-v-in-tag tag-separator separate-pull-requests' \
            '(.packages["."] // {}) as $p | first(($keys | split(" "))[] as $k | select(has($k) or ($p | has($k))) | $k) // ""' release-please-config.json)
          if [ -n "$key" ]; then
            echo "::error file=release-please-config.json::Remove '$key' from release-please-config.json: the release workflow doesn't support it."
            exit 1
          fi
          if jq -e 'any([., (.packages["."] // {})][] | select(has("include-component-in-tag")); .["include-component-in-tag"] != false)' release-please-config.json >/dev/null; then
            echo "::error file=release-please-config.json::'include-component-in-tag' must be false or absent: the release workflow doesn't support it otherwise."
            exit 1
          fi

      - name: Warn unless squash-only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! rules=$(gh api "repos/$REPO/rules/branches/$BRANCH"); then
            echo "::warning::Couldn't read the rules on $BRANCH, so squash-only merging wasn't checked."
            exit 0
          fi
          if ! jq -e 'any(.[]; .type == "pull_request" and .parameters.allowed_merge_methods == ["squash"])' <<<"$rules" >/dev/null; then
            echo "::warning::$BRANCH doesn't restrict merges to squash. release-please only reads squash-merged PR titles, so merge commits won't release. Re-run apply-rulesets.sh with SQUASH_ONLY=1."
          fi

      # Pushes and PRs made with the built-in token don't trigger workflows: branch-policy would never report
      # on the Release PR and tag-triggered deploys would never run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # We tag ourselves because release-please would trust edited PR metadata; everything here is pinned to the
      # manifest at the merge commit. It runs before release-please, which won't open the next Release PR while a
      # merged one is still labelled pending.
      - name: Publish verified releases
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          APP_BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          # The label filter works with Issues disabled and has no fixed window; REST gives the authoritative fields.
          # shellcheck disable=SC2016
          nums=$(gh api graphql --paginate -f query='query($owner:String!,$name:String!,$base:String!,$endCursor:String){repository(owner:$owner,name:$name){pullRequests(states:MERGED,labels:["autorelease: pending"],baseRefName:$base,first:100,after:$endCursor){nodes{number} pageInfo{hasNextPage endCursor}}}}' -f owner="${REPO%%/*}" -f name="${REPO#*/}" -f base="$BRANCH" --jq '.data.repository.pullRequests.nodes[].number')
          candidates=$(for num in $nums; do gh api "repos/$REPO/pulls/$num" || exit 1; done | jq -sc 'sort_by(.merged_at) | .[]')

          # Failed PRs are reported after the loop so one bad PR doesn't hold back valid ones.
          failures=()
          fail() {
            failures+=("::error::PR #$n carries 'autorelease: pending' but failed the $1 check, so it wasn't released. If someone edited it, check it and remove the label.")
          }

          # A relabelled older Release PR would otherwise tag old code as Latest and trigger deploys.
          refs=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/v" --jq '.[].ref')
          highest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }

          file_at() { gh api --jq .content "repos/$REPO/contents/$1?ref=$merge_sha" | base64 -d; }

          tag=
          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            n=$(jq -r .number <<<"$pr")
            merge_sha=$(jq -r '.merge_commit_sha // ""' <<<"$pr")
            [ "$(jq -r .user.login <<<"$pr")" = "$APP_BOT" ] || { fail author; continue; }
            [ "$(jq -r .head.ref <<<"$pr")" = "release-please--branches--$BRANCH" ] && [ "$(jq -r '.head.repo.full_name // ""' <<<"$pr")" = "$REPO" ] || { fail branch; continue; }
            [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { fail merged-into-trunk; continue; }
            status=$(gh api --jq .status "repos/$REPO/compare/$merge_sha...$SHA")
            [ "$status" = ahead ] || [ "$status" = identical ] || { fail merged-into-trunk; continue; }

            version=$(file_at .release-please-manifest.json | jq -r '.["."] // ""')
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { fail title; continue; }
            [ "$(jq -r .title <<<"$pr")" = "chore($BRANCH): release $version" ] || { fail title; continue; }
            if [ -n "$highest" ] && newer "$highest" "v$version"; then fail out-of-order; continue; fi

            # Drafts create no tag, so the tag ref decides. Only the App can create version tags, so one already at
            # this merge commit is from a run that stopped before relabelling; finish that release instead.
            create=(--target "$merge_sha")
            need_release=true
            if out=$(gh api "repos/$REPO/git/ref/tags/v$version" 2>&1); then
              [ "$(jq -r .object.sha <<<"$out")" = "$merge_sha" ] || { fail already-released; continue; }
              create=(--verify-tag)
              if out=$(gh api "repos/$REPO/releases/tags/v$version" 2>&1); then
                need_release=false
              elif [[ "$out" != *"HTTP 404"* ]]; then
                echo "::error::Couldn't check whether the release for v$version exists."
                exit 1
              fi
            elif [[ "$out" != *"HTTP 404"* ]]; then
              echo "::error::Couldn't check whether v$version exists."
              exit 1
            fi

            if [ "$need_release" = true ]; then
              notes=$(mktemp)
              file_at CHANGELOG.md | awk '/^## /{c++; next} c==1' >"$notes"
              grep -q '[^[:space:]]' "$notes" || { fail changelog; continue; }
              gh release create "v$version" --repo "$REPO" "${create[@]}" --title "v$version" --notes-file "$notes" --latest
            fi

            after=$(gh api "repos/$REPO/git/ref/tags/v$version") || { fail tag; continue; }
            [ "$(jq -r .object.sha <<<"$after")" = "$merge_sha" ] || { fail tag; continue; }
            gh api -X DELETE "repos/$REPO/issues/$n/labels/autorelease:%20pending"
            gh api -X POST "repos/$REPO/issues/$n/labels" -f 'labels[]=autorelease: tagged'
            highest="v$version"
            if [ "$need_release" = true ]; then tag="v$version"; fi
          done <<<"$candidates"

          echo "release_created=$([ -n "$tag" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "tag_name=$tag" >>"$GITHUB_OUTPUT"; fi
          if [ "${#failures[@]}" -gt 0 ]; then
            printf '%s\n' "${failures[@]}"
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
